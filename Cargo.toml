[workspace]
members = [
    "crates/rustbound-conformance",
    "crates/rustbound-protocol",
    "crates/rustbound-server",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"

[workspace.lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "warn", priority = -1 }
unused_lifetimes = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
expect_used = "warn"
unwrap_used = "warn"

# Default release: keep symbols light for normal `--release` runs.
[profile.release]
strip = "debuginfo"

# Extreme miniaturization for distribution (箱庭計画).
#   cargo build -p rustbound-server --profile dist
[profile.dist]
inherits = "release"
lto = true
codegen-units = 1
opt-level = "z"
strip = true
panic = "abort"
